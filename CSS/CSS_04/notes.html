<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>units in css</title>
  </head>
  <body>
    <!-- 

    #1 Units : keyword used  to measure / assign the space occupied by the html element in a web page . 

    Types of units in css - 
        >> 2 types of css units we have :
                1. fixed 
                        >> pixels 

                2. relative 
                        >> percentage - depends on parent size
                        >> vw / vh    - depends on screen size 

    example - 
   !screen size -  width = 1200px 
    parent_01 = width = 50% of screen [main parent] - 600px
       * >> child_01 => 50% of the parent_01 = 300px 

    parent_02 = width = 50vw - 50% of the screen width  =  600px 
        * >> child_01 => 50vw - 50% of the screen width =  600px 

    
    
    
    
    -->
  </body>
</html>
