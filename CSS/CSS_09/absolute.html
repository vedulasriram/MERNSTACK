<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .parent {
        width: 1000px;
        height: 1000px;
        background-color: skyblue;
        padding: 50px;
        box-sizing: border-box;
      }
      .child {
        box-sizing: border-box;
        width: 400px;
        border: solid;
        margin: 10px;
        padding-top: 50px;
        font-size: 100px;
        text-align: center;
      }
      #child2 {
        background-color: burlywood;
        height: 200px;
        position: absolute;
        z-index: 7;
      }
      #child3 {
        background-color: salmon;
        height: 400px;
        position: absolute;
        z-index: 2
      }
      #child1 {
        background-color: crimson;
        color: white;
        height: 300px;
        /* ======================= */
        position: absolute;
        z-index: 5
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div id="child1" class="child">child 1</div>
      <div id="child2" class="child">child 2</div>
      <div id="child3" class="child">child 3</div>
    </div>
  </body>
</html>
