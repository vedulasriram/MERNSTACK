<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      section {
        width: 400px;
        height: 300px;
        background-color: seagreen;

        /* margin - space outside the container  */

        margin-top: 100px;
        margin-right: 30px;
        margin-bottom: 40px;
        margin-left: 50px;

        margin-top: 100px;
        margin-right: 50px;
        margin-bottom: 100px;
        margin-left: 50px;

        /* 
        >> if both opposite sides - 
            left & right , top & bottom 
            have the same values then only -
            we will go with 2 values syntax 
        */
        /* margin : top/bottom left/right ; */

        margin: 100px 50px;

        /* 
        >> if all side values are same then use 1 value syntax 
        */
        margin: 150px;

        /* 
        >> if top & bottom are different & left & right are same the we can use 3 values syntax 

        */
        /* margin : top left/right bottom  */
        margin: 10px 20px 30px;



        /* 
        >> if we have margin in all 4 direction and the values of all are different then we will use 4 values syntax 
        */
        /* margin : top right bottom left */
        margin: 10px 20px 30px 20px;


        
      }
    </style>
  </head>
  <body>
    <section></section>
  </body>
</html>
