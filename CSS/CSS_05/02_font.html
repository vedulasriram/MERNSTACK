<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Font properties in css</title>
    <style>
      pre {
        color: brown;
        /* todo : font properties  */

        /* * 1. how to change the text size  */
        font-size: 40px;

        /* * 2. how to add the weight / thickness to the text
                >> 100 , 200, 300, 400, 500, 600, 700, 800 & 900
                >> bold, bolder, lighter & normal
        */
        font-weight: lighter;
        font-weight: bold;
        font-weight: bolder;
        font-weight: normal;
        font-weight: 900;
        font-weight: 600;


        /* * text with rounded edge */
        font-family: serif;

        /* * text with sharp edge */
        font-family: sans-serif;

        /* font-family: monospace;
        font-family: cursive;
        font-family: fantasy;

        font-family: Arial, Helvetica, sans-serif; */


        font-style: italic;

      }
    </style>
  </head>
  <body>
    <pre>
        Q. What is the difference between text & font ?
        >> Text - actual content / words 
        >> Font - it defines the appearance of the text, such as 
                    > size
                    > style
                    > weight
                    > family 
                    > etc..
    </pre>
  </body>
</html>
