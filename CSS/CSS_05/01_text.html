<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      body{
        background-color: yellow;
      }
      p {
        /* text color  */
        color:blueviolet;
        font-weight: bolder;

        /* how to add the line 
            >> underline - line below the text 
            >> overline  - line on the top of the text
            >> line-through - line on the text  
        */
        text-decoration: underline;
        text-decoration: overline;
        text-decoration: line-through;
        text-decoration: none;
        
      

        /* align the text - in left, right & center  */
        text-align:right;
        text-align: center;
       
        /* justify : it distribute the entire space in the row equally. */
        text-align: justify;
        text-align: left;

        
        /* * space b/w the words *  */
        word-spacing: 50px;

        /* * space b/w the letters *  */
        letter-spacing:20px;

        /* * space b/w 2 lines - line height  */
        line-height:50px;

        /* * text transformation  */
        text-transform: capitalize;
       

        /* todo : how to add the space in the starting of the text */
        text-indent:50px;
      }
    </style>
  </head>
  <body>
    <p>
      Lorem ipsum Dolor sit amet consectetur adipisicing elit. Saepe cumque
      suscipit vel amet. Architecto cumque accusamus praesentium expedita
      officiis veritatis. Impedit voluptatibus provident ratione architecto sint
      dolor Vitae culpa tempora.
    </p>
  </body>
</html>
