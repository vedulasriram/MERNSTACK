? What do you mean by lists in html ?
* 
In HTML, lists are used to display a group of related items in an organized way.
lists are of three types :
1. ORDERED
2. UNORDERED
3. DESCRIPTIVE

q1. WHAT IS OREDER LIST ?

* A list that follows a sequence that follows a sequence [1,A,a,I,i]

q2. How to create a ordered list in html ?

>> if we have 1 word => word is tag name
>> if we have 2 words => list => ol is the tag name

WHAT IS UN-OREDER LIST ?

* A list that not follows a sequence that follows a sequence [bullets or any other symbols].

q3. How to add the list items ?

by using the "Li" tag.

<ol>  = Ordered List
<li>  = List Item

Default type = "1"

type:
"1" = Numbers
"A" = Uppercase alphabets
"a" = Lowercase alphabets
"I" = Uppercase Roman numerals
"i" = Lowercase Roman numerals

start = Specifies the starting number/position.

Example:
<ol type="A" start="7">
    G, H, I, J...

    ! # SEMANTIC TAGS:
    >> Semantic tags are HTML elements whose name itself describes the meaning and purpose of the content inside them.
    >> These are the tags that tells their own meaning. (by the name only we can understand the useCase of that tag.)
    For example:
    <header>
    <h1>My Website</h1>
   </header>
   Here, <header> clearly tells the browser/developer:
"This section is the header of the page."
