<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 
    !! custom QR Code !! 

    1. QR code is an image that contains the link
    2. visit : https://goqr.me/api/
    3. URL :  https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Example

    4. data = URL 
    5. whatever the value u have for the data that will be the link of the QR Code. 
    
    -->
    <h4>scan & see the result</h4>

    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.instagram.com"
    />
  </body>
</html>
